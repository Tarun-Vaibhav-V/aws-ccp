# Netlify deploy config for monorepo-style layout.
# No base dir — we cd into app/ explicitly so paths are unambiguous.
[build]
  command = "cd app && npm install && npm run build"
  publish = "app/dist"

# SPA fallback — required for React Router (BrowserRouter).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
